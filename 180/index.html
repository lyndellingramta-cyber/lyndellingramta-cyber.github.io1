<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>Deezy's Mansion — 180&deg; 3D</title>
<style>
  :root { --gold:#d9a441; --gold-bright:#f2c96b; --ink:#0a0806; --text:#f5ead2; --dim:#c9b98f; }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; }
  #gl { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #ui {
    position:fixed; left:50%; bottom:5vh; transform:translateX(-50%);
    width:min(92vw, 560px); text-align:center; z-index:10;
    background:rgba(12,9,5,.78); border:1px solid rgba(217,164,65,.45);
    border-radius:16px; padding:18px 20px 20px; color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    box-shadow:0 8px 40px rgba(0,0,0,.6);
  }
  #ui h1 { margin:0 0 4px; font-size:20px; letter-spacing:.5px; color:var(--gold-bright); }
  #ui p.sub { margin:0 0 14px; font-size:13px; color:var(--dim); }
  #status { font-size:13px; color:var(--dim); margin:0 0 14px; min-height:18px; }
  #status b { color:var(--text); }
  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  button {
    font-family:inherit; font-size:16px; font-weight:700; cursor:pointer;
    border-radius:12px; padding:12px 20px; border:1px solid var(--gold);
    background:linear-gradient(180deg,#f2c96b,#c98f2e); color:#1a1206;
  }
  button.ghost { background:transparent; color:var(--gold-bright); }
  button:disabled { opacity:.45; cursor:default; }
  #hint { margin:12px 0 0; font-size:12px; color:var(--dim); line-height:1.5; }
  #fallbackVideo { display:none; position:fixed; inset:0; width:100%; height:100%; background:#000; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<video id="fallbackVideo" controls loop playsinline></video>
<div id="ui">
  <h1>Deezy&rsquo;s Mansion &mdash; 180&deg; 3D</h1>
  <p class="sub">10-second foyer test &middot; true stereoscopic 180 &middot; loops</p>
  <p id="status">Loading video&hellip;</p>
  <div class="row">
    <button id="enterBtn" disabled>Enter VR</button>
    <button id="playBtn" class="ghost" disabled>Pause</button>
    <button id="soundBtn" class="ghost" disabled>Sound: off</button>
  </div>
  <p id="hint">Open this page in the Quest Browser and tap <b>Enter VR</b>.<br>
  In the headset, squeeze the trigger to pause / play. Drag on this screen to look around without VR.</p>
</div>
<video id="vid" muted loop playsinline preload="auto" style="display:none"></video>

<script>
"use strict";
/* ------------------------------------------------------------------ */
/*  Stereo 180 player.                                                */
/*  Source file: stereo180-test-10s_180_TB.mp4 — 960x1920, top-bottom */
/*  stereo. TOP half = LEFT eye, BOTTOM half = RIGHT eye. The frame  */
/*  is the FRONT 180 degrees of the equirect (full width = -90..+90   */
/*  degrees azimuth). The video cannot be pushed to GitHub as binary, */
/*  so it is stored as 7 base64 text parts and reassembled here.      */
/* ------------------------------------------------------------------ */
var PARTS = 7;
var PART_PREFIX = "stereo180-test-10s_180_TB.mp4.b64.part";
var RADIUS = 10;

var video = document.getElementById("vid");
var statusEl = document.getElementById("status");
var enterBtn = document.getElementById("enterBtn");
var playBtn = document.getElementById("playBtn");
var soundBtn = document.getElementById("soundBtn");
var ui = document.getElementById("ui");

function setStatus(html) { statusEl.innerHTML = html; }

/* ---------------- video load: fetch .b64 parts, decode, blob ------- */
function loadVideo() {
  var chunks = [];
  var chain = Promise.resolve();
  for (var i = 0; i < PARTS; i++) {
    (function (i) {
      chain = chain.then(function () {
        setStatus("Loading video&hellip; part " + (i + 1) + " of " + PARTS);
        return fetch(PART_PREFIX + i).then(function (r) {
          if (!r.ok) throw new Error("part " + i + " HTTP " + r.status);
          return r.text();
        }).then(function (t) { chunks[i] = t; });
      });
    })(i);
  }
  return chain.then(function () {
    setStatus("Decoding video&hellip;");
    var b64 = chunks.join("").replace(/\s+/g, "");
    var bin = new Uint8Array(Math.floor(b64.length * 3 / 4));
    var n = 0;
    for (var i = 0; i < b64.length; i += 32768) {
      var s = atob(b64.slice(i, i + 32768));
      for (var j = 0; j < s.length; j++) bin[n++] = s.charCodeAt(j);
    }
    var blob = new Blob([bin.subarray(0, n)], { type: "video/mp4" });
    video.src = URL.createObjectURL(blob);
    return new Promise(function (res, rej) {
      video.onloadedmetadata = function () { res(); };
      video.onerror = function () { rej(new Error("video decode failed")); };
    });
  }).then(function () {
    setStatus("<b>Ready.</b> Tap Enter VR.");
    playBtn.disabled = false;
    soundBtn.disabled = false;
    updateXRButton();
    video.play().catch(function () { /* gesture needed; Enter VR will play */ });
  }).catch(function (err) {
    setStatus("<b>Video failed to load:</b> " + err.message +
      ' <a href="#" onclick="location.reload();return false;" style="color:#f2c96b">Tap to retry</a>');
  });
}

/* ---------------- WebGL: half-sphere + per-eye texture half -------- */
var canvas = document.getElementById("gl");
var gl = canvas.getContext("webgl", { xrCompatible: true, antialias: true });
var glOK = !!gl;

function compileShader(type, src) {
  var sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    throw new Error("shader: " + gl.getShaderInfoLog(sh));
  }
  return sh;
}

var prog = null, tex = null, mesh = null, lastVideoTime = -1;

function initGL() {
  var vs = compileShader(gl.VERTEX_SHADER, [
    "attribute vec3 aPos; attribute vec2 aUV;",
    "uniform mat4 uMVP; varying vec2 vUV;",
    "void main(){ vUV = aUV; gl_Position = uMVP * vec4(aPos, 1.0); }"
  ].join("\n"));
  var fs = compileShader(gl.FRAGMENT_SHADER, [
    "precision mediump float;",
    "varying vec2 vUV; uniform sampler2D uTex; uniform float uEye;",
    "// uEye 0 = LEFT eye -> TOP half of frame (t 0..0.5)",
    "// uEye 1 = RIGHT eye -> BOTTOM half of frame (t 0.5..1)",
    "// flipY is OFF, so t=0 is the TOP row of the video frame.",
    "void main(){",
    "  float t = mix(vUV.y * 0.5, 0.5 + vUV.y * 0.5, uEye);",
    "  gl_FragColor = texture2D(uTex, vec2(vUV.x, t));",
    "}"
  ].join("\n"));
  prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error("link: " + gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  // 1x1 black placeholder until the video has a frame
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 1, 1, 0, gl.RGB, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0]));

  mesh = buildSphere(64, 32);
  var posBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, mesh.pos, gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
  var uvBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, uvBuf);
  gl.bufferData(gl.ARRAY_BUFFER, mesh.uv, gl.STATIC_DRAW);
  var loc2 = gl.getAttribLocation(prog, "aUV");
  gl.enableVertexAttribArray(loc2);
  gl.vertexAttribPointer(loc2, 2, gl.FLOAT, false, 0, 0);
  mesh.indexBuf = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.indexBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.idx, gl.STATIC_DRAW);

  gl.disable(gl.CULL_FACE);
  gl.disable(gl.DEPTH_TEST);
  gl.clearColor(0, 0, 0, 1);
}

// Front half-sphere: azimuth -90..+90 deg (u 0..1 across the frame),
// polar 0..180 deg (v 0 at top pole = top row of the frame).
function buildSphere(segU, segV) {
  var pos = [], uv = [], idx = [];
  for (var j = 0; j <= segV; j++) {
    var theta = Math.PI * j / segV, v = j / segV;
    for (var i = 0; i <= segU; i++) {
      var phi = -Math.PI / 2 + Math.PI * i / segU, u = i / segU;
      var st = Math.sin(theta), ct = Math.cos(theta);
      pos.push(RADIUS * st * Math.sin(phi), RADIUS * ct, -RADIUS * st * Math.cos(phi));
      uv.push(u, v);
    }
  }
  for (var j2 = 0; j2 < segV; j2++) for (var i2 = 0; i2 < segU; i2++) {
    var a = j2 * (segU + 1) + i2, b = a + 1, c = a + segU + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  return { pos: new Float32Array(pos), uv: new Float32Array(uv), idx: new Uint16Array(idx) };
}

/* ---- minimal column-major mat4 helpers ---- */
function matMul(a, b) {
  var o = new Float32Array(16);
  for (var c = 0; c < 4; c++) for (var r = 0; r < 4; r++) {
    var s = 0;
    for (var k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
    o[c * 4 + r] = s;
  }
  return o;
}
function matPerspective(fovy, aspect, near, far) {
  var f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  var o = new Float32Array(16);
  o[0] = f / aspect; o[5] = f; o[10] = (far + near) * nf; o[11] = -1;
  o[14] = 2 * far * near * nf;
  return o;
}
function matTranslate(x, y, z) {
  var o = new Float32Array(16);
  o[0] = 1; o[5] = 1; o[10] = 1; o[15] = 1; o[12] = x; o[13] = y; o[14] = z;
  return o;
}
function matRotY(a) {
  var c = Math.cos(a), s = Math.sin(a), o = new Float32Array(16);
  o[0] = c; o[2] = -s; o[5] = 1; o[8] = s; o[10] = c; o[15] = 1;
  return o;
}
function matRotX(a) {
  var c = Math.cos(a), s = Math.sin(a), o = new Float32Array(16);
  o[0] = 1; o[5] = c; o[6] = s; o[9] = -s; o[10] = c; o[15] = 1;
  return o;
}

function updateTexture() {
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    gl.bindTexture(gl.TEXTURE_2D, tex);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video); }
    catch (e) { /* frame not ready yet */ }
  }
}

function draw(mvp, eye) {
  gl.useProgram(prog);
  gl.uniformMatrix4fv(gl.getUniformLocation(prog, "uMVP"), false, mvp);
  gl.uniform1f(gl.getUniformLocation(prog, "uEye"), eye);
  gl.uniform1i(gl.getUniformLocation(prog, "uTex"), 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.indexBuf);
  gl.drawElements(gl.TRIANGLES, mesh.idx.length, gl.UNSIGNED_SHORT, 0);
}

/* ---------------- 2D fallback: drag to look (left eye) ------------- */
var yaw = 0, pitch = 0, dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener("pointerdown", function (e) { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener("pointermove", function (e) {
  if (!dragging) return;
  yaw -= (e.clientX - lastX) * 0.005;
  pitch -= (e.clientY - lastY) * 0.005;
  pitch = Math.max(-1.4, Math.min(1.4, pitch));
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener("pointerup", function () { dragging = false; });

function resizeCanvas() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w = Math.floor(canvas.clientWidth * dpr), h = Math.floor(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}
function draw2D() {
  if (xrSession) return; // XR loop owns the canvas while presenting
  requestAnimationFrame(draw2D);
  resizeCanvas();
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clear(gl.COLOR_BUFFER_BIT);
  updateTexture();
  var aspect = canvas.width / Math.max(1, canvas.height);
  var proj = matPerspective(80 * Math.PI / 180, aspect, 0.1, 100);
  var view = matMul(matRotX(pitch), matRotY(yaw));
  draw(matMul(proj, view), 0);
}

/* ---------------- WebXR -------------------------------------------- */
var xrSession = null, xrRefSpace = null;

function updateXRButton() {
  if (!("xr" in navigator)) { enterBtn.disabled = true; setStatus("This browser has no WebXR. Open this page in the Quest Browser."); return; }
  navigator.xr.isSessionSupported("immersive-vr").then(function (ok) {
    enterBtn.disabled = !ok;
    if (!ok) setStatus("Immersive VR is not available here. Open this page in the Quest Browser.");
  }).catch(function () { enterBtn.disabled = true; });
}

function onXRFrame(time, frame) {
  var session = frame.session;
  session.requestAnimationFrame(onXRFrame);
  var pose = frame.getViewerPose(xrRefSpace);
  if (!pose) return;
  var layer = session.renderState.baseLayer;
  gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
  updateTexture();
  // Keep the sphere centred on the viewer's head so turning never
  // puts the viewer outside the 180 dome.
  var model = matTranslate(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
  for (var i = 0; i < pose.views.length; i++) {
    var view = pose.views[i];
    var vp = layer.getViewport(view);
    gl.viewport(vp.x, vp.y, vp.width, vp.height);
    var mvp = matMul(view.projectionMatrix, matMul(view.transform.inverse.matrix, model));
    draw(mvp, view.eye === "left" ? 0 : 1);
  }
}

function onSessionEnd() {
  xrSession = null;
  ui.style.display = "";
  requestAnimationFrame(draw2D);
}

function togglePlay() {
  if (video.paused) { video.play().catch(function () {}); playBtn.textContent = "Pause"; }
  else { video.pause(); playBtn.textContent = "Play"; }
}

enterBtn.addEventListener("click", function () {
  if (!navigator.xr) return;
  video.play().catch(function () {});
  navigator.xr.requestSession("immersive-vr", { optionalFeatures: ["local-floor", "bounded-floor"] })
    .then(function (session) {
      xrSession = session;
      return gl.makeXRCompatible().then(function () { return session; });
    })
    .then(function (session) {
      var refPromise = session.requestReferenceSpace("local-floor")
        .catch(function () { return session.requestReferenceSpace("viewer"); });
      return refPromise.then(function (refSpace) {
        xrRefSpace = refSpace;
        session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });
        session.addEventListener("select", togglePlay);
        session.addEventListener("end", onSessionEnd);
        ui.style.display = "none";
        video.play().catch(function () {});
        session.requestAnimationFrame(onXRFrame);
      });
    })
    .catch(function (err) {
      setStatus("<b>Could not start VR:</b> " + err.message);
    });
});

playBtn.addEventListener("click", togglePlay);
soundBtn.addEventListener("click", function () {
  video.muted = !video.muted;
  soundBtn.textContent = video.muted ? "Sound: off" : "Sound: on";
});
video.addEventListener("play", function () { playBtn.textContent = "Pause"; });
video.addEventListener("pause", function () { playBtn.textContent = "Play"; });

/* ---------------- boot --------------------------------------------- */
if (!glOK) {
  document.getElementById("fallbackVideo").style.display = "block";
  ui.style.display = "none";
  setStatus("WebGL is not available in this browser.");
  loadVideo().then(function () {
    var fv = document.getElementById("fallbackVideo");
    fv.src = video.src; fv.muted = false;
  });
} else {
  try {
    initGL();
    requestAnimationFrame(draw2D);
    loadVideo();
  } catch (err) {
    setStatus("<b>Player failed to start:</b> " + err.message);
  }
}
</script>
</body>
</html>
